# Reusable GitHub Actions workflow template for building an Android APK
# from a PySide6/Qt6 desktop app via `pyside6-android-deploy`.
#
# CANONICAL SOURCE: this file lives in Tools_Central\pyside6-android-deploy\
# workflow-template\build-apk.yml. It is copied (not referenced remotely -
# this is a local, personal toolchain, not a published GitHub Action) into
# each PySide6-Android project's own .github\workflows\build-apk.yml by
# setup-project-cloud-build.ps1 in this same folder.
#
# WHY A CLOUD BUILD AT ALL: pyside6-android-deploy is built on
# python-for-android, which as of 2026 only supports Linux as the build
# host (confirmed via Qt's own blog post and the still-open
# kivy/python-for-android GitHub issue #2872 requesting native Windows
# support). Without WSL2 available locally, a Linux build host has to come
# from somewhere else - here, a GitHub Actions "ubuntu-latest" runner.
#
# STATUS: template/scaffold, not yet verified with a real build. The exact
# pyside6-android-deploy CLI flags, Android NDK/SDK versions, and Python
# version need confirming against the actual project on a first real run -
# see the TODO markers below. Treat this as a strong starting point, not a
# guaranteed-working recipe yet.

name: Build Android APK (pyside6-android-deploy)

on:
  workflow_dispatch: {}   # manually triggered (e.g. via `gh workflow run` from trigger-and-fetch-apk.ps1)
  push:
    branches: [main]
    paths:
      - "BIN/versions/**/PyModul/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: confirm the Python version pyside6-android-deploy's Android
      # wheels target for the PySide6 version this project pins
      # (Tools_Central\Python\python\requirements.txt: PySide6==6.11.0).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # android-actions/setup-android installs a recent Android SDK
      # (platform-tools, cmdline-tools) - pyside6-android-deploy fetches
      # its own required NDK version through the sdkmanager it finds here.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Linux build dependencies for python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev \
            build-essential ccache unzip

      - name: Install PySide6 + pyside6-android-deploy
        run: |
          # pyside6-android-deploy refuses to run outside a virtual
          # environment - without one it tries to prompt interactively
          # ("Proceed? [Y/n]"), which crashes with EOFError on a
          # non-interactive CI runner. Use a venv so it never gets there.
          python -m venv "$GITHUB_WORKSPACE/.venv-android-build"
          source "$GITHUB_WORKSPACE/.venv-android-build/bin/activate"
          python -m pip install --upgrade pip
          # TODO: pin to the same PySide6 version as Tools_Central's central
          # WinPython environment, so the desktop and Android builds match.
          python -m pip install PySide6==6.11.0
          # pyside6-android-deploy needs these extras (jinja2, pkginfo, tqdm,
          # packaging==24.1); PySide6 ships the exact pinned list for the
          # installed version, so install from that rather than guessing.
          python -m pip install -r "$(python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'scripts', 'requirements-android.txt'))")"

      # --wheel-pyside=auto / --wheel-shiboken=auto do NOT auto-download a
      # matching Android wheel - PySide6's own auto-resolution picked up the
      # desktop (manylinux) wheel instead, which isn't platform-tagged for
      # Android and made pyside6-android-deploy fail with "PySide wheel
      # corrupted. Wheel name should end with platform name". Qt publishes
      # prebuilt Android wheels (cp311, matching our PySide6==6.11.0 pin)
      # directly under download.qt.io, so fetch those explicitly instead.
      # TODO: this only builds for arm64 (aarch64) devices, which covers
      # virtually all real Android hardware; add the android_x86_64 wheel
      # pair here too if an emulator build is ever needed.
      - name: Download PySide6 Android wheels
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android-wheels"
          curl -fL -o "$GITHUB_WORKSPACE/android-wheels/pyside6-android_aarch64.whl" \
            "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl"
          curl -fL -o "$GITHUB_WORKSPACE/android-wheels/shiboken6-android_aarch64.whl" \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.11.0-6.11.0-cp311-cp311-android_aarch64.whl"

      # TODO: this is the step most likely to need adjustment on the first
      # real run - confirm the actual pyside6-android-deploy invocation
      # (entry point file name, --name, extra-args for NDK/SDK paths set up
      # by android-actions/setup-android above).
      - name: Build APK
        working-directory: BIN/versions/v0.1/PyModul
        run: |
          source "$GITHUB_WORKSPACE/.venv-android-build/bin/activate"
          pyside6-android-deploy --name "VacationFinder" \
            --wheel-pyside="$GITHUB_WORKSPACE/android-wheels/pyside6-android_aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android-wheels/shiboken6-android_aarch64.whl"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vacation-finder-apk
          path: BIN/versions/v0.1/PyModul/**/*.apk
          if-no-files-found: error
